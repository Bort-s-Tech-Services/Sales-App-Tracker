<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | SalesTracker Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <!-- Mobile Header -->
        <div class="mobile-header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span>SalesTracker</span>
            </div>
            <button class="menu-toggle" id="mobileMenuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <span>SalesTracker</span>
                </div>
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <span class="version-tag">v2.4</span>
                    <button class="sidebar-close" id="sidebarCloseBtn"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                    <span class="online-indicator"></span>
                </div>
                <div class="user-details">
                    <span class="user-name" id="userName">Loading...</span>
                    <span class="user-email" id="userEmail">Loading...</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="sales.html" class="nav-item">
                    <i class="fas fa-plus-circle"></i>
                    <span>Add Sales</span>
                </a>
                <a href="inventory.html" class="nav-item">
                    <i class="fas fa-boxes"></i>
                    <span>Inventory</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Reports</span>
                </a>
                <a href="settings.html" class="nav-item active">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="header-left">
                    <h1>Account Settings</h1>
                    <p>Manage your profile, credentials, and business preferences</p>
                </div>
            </header>

            <div class="content-area">
                <!-- Alert Banner -->
                <div id="settingsAlert" style="display: none;"></div>

                <!-- Tabs Navigation -->
                <div class="settings-tabs">
                    <button type="button" class="settings-tab-btn active" data-tab="profileTab">
                        <i class="fas fa-user-edit"></i> Profile Info
                    </button>
                    <button type="button" class="settings-tab-btn" data-tab="securityTab">
                        <i class="fas fa-shield-alt"></i> Security & Password
                    </button>
                </div>

                <!-- Profile Tab Content -->
                <div id="profileTab" class="settings-tab-content" style="display: block;">
                    <div class="form-card">
                        <div class="form-header">
                            <h2><i class="fas fa-id-card"></i> Profile Details</h2>
                        </div>
                        <form id="profileForm">
                            <div class="form-group">
                                <label for="settingsFullName">
                                    <i class="fas fa-user"></i> Full Name
                                </label>
                                <input type="text" id="settingsFullName" required placeholder="Enter full name">
                            </div>

                            <div class="form-group">
                                <label for="settingsEmail">
                                    <i class="fas fa-envelope"></i> Email Address
                                </label>
                                <input type="email" id="settingsEmail" disabled style="opacity: 0.7; cursor: not-allowed;" placeholder="admin@salestracker.cloud">
                                <small style="color: #94a3b8; font-size: 0.8rem; margin-top: 0.25rem; display: block;">Email address cannot be changed.</small>
                            </div>

                            <div class="form-group">
                                <label for="settingsCompany">
                                    <i class="fas fa-building"></i> Company / Business Name
                                </label>
                                <input type="text" id="settingsCompany" placeholder="Enter company name">
                            </div>

                            <div style="margin-top: 1.5rem;">
                                <button type="submit" class="btn btn-primary btn-large">
                                    <i class="fas fa-save"></i> Save Profile Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Security Tab Content -->
                <div id="securityTab" class="settings-tab-content" style="display: none;">
                    <div class="form-card">
                        <div class="form-header">
                            <h2><i class="fas fa-lock"></i> Change Password</h2>
                        </div>
                        <form id="passwordForm">
                            <div class="form-group">
                                <label for="currentPassword">
                                    <i class="fas fa-key"></i> Current Password
                                </label>
                                <input type="password" id="currentPassword" required placeholder="••••••••••••">
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="newPassword">
                                        <i class="fas fa-lock"></i> New Password
                                    </label>
                                    <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password">
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">
                                        <i class="fas fa-check-circle"></i> Confirm New Password
                                    </label>
                                    <input type="password" id="confirmPassword" required placeholder="Confirm new password">
                                </div>
                            </div>

                            <div style="margin-top: 1.5rem;">
                                <button type="submit" class="btn btn-primary btn-large">
                                    <i class="fas fa-key"></i> Update Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js?v=4.0"></script>
    <script src="js/api-client.js?v=4.0"></script>
    <script src="js/auth.js?v=4.0"></script>
</body>
</html>
