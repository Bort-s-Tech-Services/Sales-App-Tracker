<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Sales Tracker Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-form-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h1>Create Account</h1>
                <p>Join SalesTracker Pro to manage sales & inventory</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input type="text" id="fullName" required 
                           placeholder="John Doe"
                           autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" required 
                           placeholder="your.email@example.com"
                           autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="companyName">
                        <i class="fas fa-building"></i> Company / Store Name
                    </label>
                    <input type="text" id="companyName" 
                           placeholder="Acme Retail Solutions">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" required 
                               placeholder="Minimum 6 characters"
                               minlength="6"
                               autocomplete="new-password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="registerBtn" style="background: linear-gradient(135deg, #6366f1, #a855f7); border: none; padding: 0.85rem; font-weight: 700; margin-top: 1rem;">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>

                <div class="auth-divider">
                    <span>Already have an account?</span>
                </div>

                <a href="login.html" class="btn btn-outline btn-block" style="border-color: rgba(255,255,255,0.2); color: #fff; text-align: center;">
                    <i class="fas fa-sign-in-alt"></i> Sign In Instead
                </a>

                <div id="authError" style="display:none; margin-top:1.25rem; padding:0.75rem; background:rgba(239,68,68,0.2); color:#f87171; border:1px solid rgba(239,68,68,0.4); border-radius:10px; text-align:center; font-size:0.9rem;"></div>

                <div class="auth-footer">
                    <a href="index.html" class="back-home">
                        <i class="fas fa-arrow-left"></i> Back to Home Page
                    </a>
                </div>
            </form>
        </div>

        <div class="auth-image-side">
            <div class="auth-image-overlay">
                <h2>Start Managing Profits Today</h2>
                <p>Access automated profit calculations, low-stock inventory alerts, and one-click financial report downloads.</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passInput = document.getElementById('password');

            if (togglePassword && passInput) {
                togglePassword.addEventListener('click', () => {
                    const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passInput.setAttribute('type', type);
                    togglePassword.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                });
            }
        });
    </script>
</body>
</html>
