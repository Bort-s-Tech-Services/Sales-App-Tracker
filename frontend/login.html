<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sales Tracker Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-form-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to your SalesTracker Pro account</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" required 
                           placeholder="admin@salestracker.cloud"
                           autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" required 
                               placeholder="Enter your password"
                               autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="background: linear-gradient(135deg, #6366f1, #a855f7); border: none; padding: 0.85rem; font-weight: 700;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <button type="button" class="demo-autofill-btn" id="demoAutofillBtn">
                    <i class="fas fa-user-shield"></i> Auto-fill Demo Credentials
                </button>

                <div class="auth-divider">
                    <span>New to SalesTracker?</span>
                </div>

                <a href="register.html" class="btn btn-outline btn-block" style="border-color: rgba(255,255,255,0.2); color: #fff; text-align: center;">
                    <i class="fas fa-user-plus"></i> Create New Account
                </a>

                <div id="authError" style="display:none; margin-top:1.25rem; padding:0.75rem; background:rgba(239,68,68,0.2); color:#f87171; border:1px solid rgba(239,68,68,0.4); border-radius:10px; text-align:center; font-size:0.9rem;"></div>

                <div class="auth-footer">
                    <a href="index.html" class="back-home">
                        <i class="fas fa-arrow-left"></i> Back to Home Page
                    </a>
                </div>
            </form>
        </div>

        <div class="auth-image-side">
            <div class="auth-image-overlay">
                <h2>Cloud-Native Sales Analytics</h2>
                <p>Track transactions, monitor profits, and upload receipts with Amazon S3 zero-disk cloud architecture.</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const demoBtn = document.getElementById('demoAutofillBtn');
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            const togglePassword = document.getElementById('togglePassword');

            if (demoBtn) {
                demoBtn.addEventListener('click', () => {
                    emailInput.value = 'admin@salestracker.cloud';
                    passInput.value = 'admin123';
                });
            }

            if (togglePassword && passInput) {
                togglePassword.addEventListener('click', () => {
                    const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passInput.setAttribute('type', type);
                    togglePassword.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                });
            }
        });
    </script>
</body>
</html>
