<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Sales Tracker Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <!-- Mobile Header -->
        <div class="mobile-header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span>SalesTracker</span>
            </div>
            <button class="menu-toggle" id="mobileMenuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <span>SalesTracker</span>
                </div>
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <span class="version-tag">v2.4</span>
                    <button class="sidebar-close" id="sidebarCloseBtn"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                    <span class="online-indicator"></span>
                </div>
                <div class="user-details">
                    <span class="user-name" id="userName">Loading...</span>
                    <span class="user-email" id="userEmail">Loading...</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="sales.html" class="nav-item">
                    <i class="fas fa-plus-circle"></i>
                    <span>Add Sales</span>
                </a>
                <a href="inventory.html" class="nav-item">
                    <i class="fas fa-boxes"></i>
                    <span>Inventory</span>
                </a>
                <a href="reports.html" class="nav-item active">
                    <i class="fas fa-chart-pie"></i>
                    <span>Reports</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Detailed Reports</h1>
                <p>Analyze your business performance</p>
            </header>
            <div class="content-area">
                <div class="table-card">
                    <h3>Daily Profit Tracking</h3>
                    <div id="reportContainer">
                        <p>Loading report data...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/reports.js"></script>
</body>
</html>
